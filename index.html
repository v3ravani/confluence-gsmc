<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/logos/gsmc_crest.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CONFLUENCE 2026 | Seth GS Medical College & KEM Hospital, Mumbai</title>
    <meta name="description" content="CONFLUENCE 2026 - International Medical & Research Conference organised by Seth GS Medical College & King Edward VII Memorial Hospital, Mumbai." />
    <!-- Google Fonts: Sora & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Prevent Flash of Unstyled Theme -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('confluence_theme');
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="site bg-[#F6F9FC] text-ink font-body antialiased selection:bg-[#1D344F] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
